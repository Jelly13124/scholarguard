<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Image — The ScholarGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: #FAF7F1;
      color: #0F1B2D;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 70px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 15% 15%, rgba(184, 136, 76, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 95%, rgba(31, 58, 46, 0.08) 0%, transparent 55%),
        #FAF7F1;
    }

    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
      mix-blend-mode: multiply;
    }

    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8F6932;
      font-weight: 500;
    }

    .flags {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #0F1B2D;
      opacity: 0.8;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .flags .bar {
      display: inline-block;
      width: 1px;
      height: 14px;
      background: #B8884C;
      opacity: 1;
    }

    .headline {
      font-family: 'Fraunces', serif;
      font-size: 86px;
      line-height: 0.98;
      letter-spacing: -0.035em;
      font-weight: 400;
      max-width: 1040px;
      font-variation-settings: 'opsz' 144, 'SOFT' 50, 'WONK' 0;
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    .headline .ital {
      font-style: italic;
      color: #B8884C;
      font-variation-settings: 'opsz' 144, 'SOFT' 50, 'WONK' 1;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .wordmark {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      letter-spacing: -0.02em;
    }

    .wordmark .the {
      font-weight: 500;
      font-variation-settings: 'opsz' 144, 'SOFT' 30, 'WONK' 0;
    }

    .wordmark .name {
      font-style: italic;
      font-variation-settings: 'opsz' 144, 'SOFT' 50, 'WONK' 1;
    }

    .domain {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6B7280;
    }

    .stats {
      display: flex;
      gap: 40px;
      align-items: baseline;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-num {
      font-family: 'Fraunces', serif;
      font-size: 42px;
      font-weight: 300;
      color: #B8884C;
      line-height: 1;
      font-variation-settings: 'opsz' 144, 'SOFT' 0, 'WONK' 1;
      font-feature-settings: 'lnum' 1;
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6B7280;
    }

    .gold-rule {
      position: absolute;
      top: 50%;
      right: 0;
      width: 200px;
      height: 1px;
      background: linear-gradient(to left, rgba(184, 136, 76, 0.5), transparent);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="gold-rule"></div>

    <div class="row-top">
      <div class="eyebrow">A research project on academic appeals</div>
      <div class="flags"><span>US</span><span class="bar"></span><span>UK</span></div>
    </div>

    <h1 class="headline">
      Real US and UK<br />
      academic case<br />
      <span class="ital">breakdowns.</span>
    </h1>

    <div class="footer">
      <div>
        <div class="wordmark">
          <span class="the">The</span> <span class="name">ScholarGuard</span>
        </div>
        <div class="domain" style="margin-top: 6px;">thescholarguard.com</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-num">50+</div>
          <div class="stat-label">Cases</div>
        </div>
        <div class="stat">
          <div class="stat-num">2</div>
          <div class="stat-label">Jurisdictions</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
